services:
  redis:
    image: redis:7-alpine
    container_name: clipforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: clipforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  worker-general:
    build: .
    command: celery -A app.tasks.celery_app worker -Q default,transcription,indexing --loglevel=info -c 2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_BACKEND=local
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: unless-stopped

  worker-render:
    build: .
    command: celery -A app.tasks.celery_app worker -Q rendering --loglevel=info -c 1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_BACKEND=local
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      replicas: 2

volumes:
  redis_data:
  minio_data:
